name: metrics

on:
  schedule: [{cron: "17 */12 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: token missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add a METRICS_TOKEN repository secret (classic token with repo, read:org, read:user) to render the metrics."

      - name: overview
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          base: header, activity, community, repositories
          plugin_introduction: yes
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: languages
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_categories: programming
          plugin_languages_recent_categories: programming
          plugin_languages_recent_days: 30
          plugin_languages_ignored: html, css, scss

      - name: repositories
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: Pasupasastra, Netra

      - name: habits
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_trim: yes

      - name: activity
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

      - name: achievements
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: no
          plugin_achievements_limit: 8

      - name: commit renders
        if: env.HAS_TOKEN == 'true'
        run: |
          shopt -s nullglob
          renders=(/metrics_renders/metrics/*.svg)
          if [ ${#renders[@]} -eq 0 ]; then echo "nothing rendered"; exit 0; fi
          sudo cp "${renders[@]}" metrics/
          sudo chown -R "$(id -u):$(id -g)" metrics
          git add metrics
          if git diff --cached --quiet; then echo "metrics unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(metrics): update renders [skip ci]"
          git push
