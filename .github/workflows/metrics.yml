name: metrics

on:
  schedule: [{cron: "17 */12 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: token missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add a METRICS_TOKEN repository secret (classic token with repo, read:org, read:user) to render the metrics."

      - name: overview
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          config_display: large
          base: header, activity, community, repositories
          plugin_introduction: yes
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: languages
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          config_display: large
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_categories: programming
          plugin_languages_ignored: html, css, scss

      - name: lines
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DarmawanWeb
          output_action: none
          config_timezone: Asia/Jakarta
          config_display: large
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_lines_delay: 20

      - name: commits
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/commits.py DarmawanWeb metrics/commits.svg 6366F1

      - name: commit renders
        if: env.HAS_TOKEN == 'true'
        run: |
          shopt -s nullglob
          renders=(/metrics_renders/metrics/*.svg)
          if [ ${#renders[@]} -eq 0 ]; then echo "nothing rendered"; exit 0; fi
          sudo cp "${renders[@]}" metrics/
          sudo chown -R "$(id -u):$(id -g)" metrics
          git add metrics
          if git diff --cached --quiet; then echo "metrics unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(metrics): update renders [skip ci]"
          git push
